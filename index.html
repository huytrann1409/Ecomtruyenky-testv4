<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --or:#E8520A;--or2:#FF6B2B;--gold:#F5A623;
  --cream:#FFF8F0;--brown:#2C1A0E;--brown2:#4A2C1A;
  --muted:#8B6E5A;--border:rgba(232,82,10,0.12);
}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',sans-serif;background:#FFF8F0;color:#2C1A0E;overflow-x:hidden;padding-bottom:70px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--or);border-radius:2px}

/* SUN BG */
.sun-bg{position:fixed;inset:0;z-index:-2;background:#FFF8F0}
.sun-orb{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,60,.4) 0%,rgba(232,82,10,.2) 35%,transparent 70%);filter:blur(40px);z-index:-1;pointer-events:none}
.grain{position:fixed;inset:0;z-index:-1;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");background-size:200px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:999;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:rgba(255,248,240,.88);backdrop-filter:blur(20px);border-bottom:.5px solid var(--border);transition:transform .3s}
.nav-logo{font-size:15px;font-weight:900;color:var(--brown);letter-spacing:.5px;flex-shrink:0}
.nav-logo span{color:var(--or)}
.nav-menu{display:flex;gap:2px;list-style:none}
.nav-menu a{font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 9px;border-radius:6px;transition:all .2s;white-space:nowrap}
.nav-menu a:hover,.nav-menu a.active{color:var(--or);background:rgba(232,82,10,.07)}
.nav-cta{background:var(--or);color:#fff;padding:8px 18px;border-radius:7px;font-weight:700;font-size:13px;text-decoration:none;transition:all .3s;flex-shrink:0}
.nav-cta:hover{background:var(--or2);transform:translateY(-1px)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.hamburger span{width:22px;height:2px;background:var(--brown);border-radius:2px;transition:all .3s;display:block}
.mobile-menu{display:none;position:fixed;top:60px;left:0;right:0;background:rgba(255,248,240,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px;flex-direction:column;gap:4px;z-index:998}
.mobile-menu a{font-size:15px;font-weight:600;color:var(--brown2);text-decoration:none;padding:10px 12px;border-radius:8px;display:block}
.mobile-menu a:hover{background:rgba(232,82,10,.07);color:var(--or)}
.mobile-menu.open{display:flex}
@media(max-width:900px){.nav-menu{display:none}.hamburger{display:flex}}
@media(max-width:600px){nav{padding:0 20px}}

/* STICKY BOTTOM */
.sticky-bot{position:fixed;bottom:0;left:0;right:0;z-index:998;background:var(--brown);padding:10px 40px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.bot-text{font-size:13px;color:rgba(255,255,255,.7);white-space:nowrap}
.bot-text strong{color:var(--gold)}
.bot-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
.bot-support{background:transparent;border:1.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);padding:8px 16px;border-radius:6px;font-weight:600;font-size:13px;text-decoration:none;transition:all .3s;white-space:nowrap}
.bot-support:hover{border-color:rgba(255,255,255,.5);color:#fff}
.bot-buy{background:var(--or);color:#fff;padding:8px 20px;border-radius:6px;font-weight:800;font-size:13px;text-decoration:none;transition:all .3s;white-space:nowrap;animation:gpulse 2.5s infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 0 0 rgba(232,82,10,.5)}50%{box-shadow:0 0 0 8px rgba(232,82,10,0)}}
.bot-buy:hover{background:var(--or2);animation:none}
@media(max-width:700px){.sticky-bot{padding:8px 16px}.bot-text{display:none}.bot-support{display:none}}

/* SECTIONS */
section{padding:110px 48px}
@media(max-width:768px){section{padding:72px 24px}}
.container{max-width:1180px;margin:0 auto}
.sec-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--or);margin-bottom:12px;display:block}
.big-title{font-size:clamp(36px,5.5vw,72px);font-weight:900;line-height:1.0;letter-spacing:-2px;color:var(--brown);margin-bottom:20px}
.big-title em{font-style:normal;color:var(--or)}
.sec-sub{font-size:clamp(15px,1.8vw,18px);color:var(--muted);line-height:1.8;max-width:640px}
.fade-in{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease}
.fade-in.visible{opacity:1;transform:none}

/* GLASS CARD */
.glass{background:rgba(255,255,255,.58);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);border-radius:28px;box-shadow:0 20px 45px rgba(0,0,0,.04)}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:60px;padding-top:100px;padding-bottom:80px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(232,82,10,.1);border:1px solid rgba(232,82,10,.22);padding:8px 16px;border-radius:100px;font-size:12px;font-weight:700;color:var(--or);margin-bottom:28px;letter-spacing:.5px}
.hero-sub{font-size:clamp(15px,1.6vw,18px);color:var(--brown2);line-height:1.85;margin-bottom:32px;max-width:540px}
.hero-sub strong{color:var(--or)}
.cred-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:36px}
.cred-item{padding:14px 16px;border-radius:16px;font-size:13px;font-weight:600;color:var(--brown2);display:flex;align-items:center;gap:8px}
.cred-icon{color:var(--or);font-size:14px;flex-shrink:0}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.btn-pri{background:linear-gradient(135deg,var(--or),#FF6B2B);color:#fff;padding:14px 28px;border-radius:10px;font-weight:800;font-size:15px;text-decoration:none;transition:all .3s;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(232,82,10,.25)}
.btn-pri:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(232,82,10,.35)}
.btn-sec{background:rgba(255,255,255,.7);color:var(--brown);padding:14px 22px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid rgba(44,26,14,.12);transition:all .3s}
.btn-sec:hover{border-color:var(--or);color:var(--or);background:rgba(232,82,10,.04)}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap}
.hstat-n{font-size:clamp(24px,3vw,36px);font-weight:900;color:var(--or);line-height:1}
.hstat-l{font-size:11px;color:var(--muted);margin-top:4px}

/* BOOK 3D */
.hero-right{position:relative;display:flex;justify-content:center;align-items:center;min-height:420px}
.book-scene{position:relative;width:340px;height:400px;display:flex;align-items:center;justify-content:center}
.book3d{width:220px;height:308px;position:relative;animation:bkFloat 5s ease-in-out infinite}
@keyframes bkFloat{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-5deg) translateY(-16px)}}
.book-cover{width:100%;height:100%;background:linear-gradient(170deg,#FF6B35 0%,#E8520A 40%,#C93D00 100%);border-radius:3px 14px 14px 3px;position:relative;box-shadow:-12px 12px 0 #7A1E00,4px 0 8px rgba(0,0,0,.15),0 32px 64px rgba(232,82,10,.4);display:flex;flex-direction:column;justify-content:space-between;padding:18px 16px 14px;overflow:hidden}
.book-spine{position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,#5A1200,#8A2200);border-radius:3px 0 0 3px}
.book-arrow-bar{position:absolute;left:18px;top:0;bottom:0;width:7px;background:var(--gold)}
.book-content{margin-left:30px;display:flex;flex-direction:column;height:100%}
.book-author-name{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:auto;padding-top:2px}
.book-arrow-symbol{font-size:38px;line-height:1;color:var(--gold);font-weight:900;display:block;margin-bottom:2px}
.book-title-main{font-size:clamp(20px,4.5vw,26px);font-weight:900;color:#fff;line-height:1.05;letter-spacing:-1px;display:flex;align-items:center;gap:5px}
.book-ecom-line{display:inline-block;height:3px;width:36px;background:rgba(255,255,255,.6);border-radius:2px;margin-left:3px;vertical-align:middle;flex-shrink:0}
.book-title-dash{display:block;width:32px;height:3px;background:rgba(255,255,255,.45);margin:7px 0}
.book-tagline-small{font-size:7px;color:rgba(255,255,255,.7);line-height:1.55;max-width:130px}
.book-logos{display:flex;align-items:center;gap:3px;margin-top:8px;flex-wrap:nowrap;width:100%}
.bl-ai{background:#3A9C4E;border-radius:3px;padding:2px 3px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bl-ai .t1{font-size:7px;font-weight:900;color:#fff;line-height:1}
.bl-ai .t2{font-size:4.5px;font-weight:600;color:rgba(255,255,255,.85);line-height:1}
.bl-bs{background:rgba(255,255,255,.15);border-radius:3px;padding:2px 4px;flex-shrink:0;display:flex;align-items:center}
.bl-bs span{font-size:5.5px;font-weight:700;color:#fff;white-space:nowrap}
.bl-td{background:rgba(255,255,255,.12);border-radius:3px;padding:2px 3px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start}
.bl-td .t1{font-size:5px;font-weight:800;color:#fff;letter-spacing:.3px;line-height:1}
.bl-td .t2{font-size:3.5px;font-weight:500;color:rgba(255,255,255,.65);line-height:1;letter-spacing:.2px}
.bl-th{border:1px solid rgba(255,255,255,.4);border-radius:2px;padding:2px 3px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.bl-th span{font-size:5.5px;font-weight:700;color:#fff;line-height:1}
.bl-nxb{background:rgba(180,20,20,.55);border-radius:3px;padding:3px 4px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bl-nxb .t1{font-size:4px;font-weight:700;color:#fff;line-height:1.2;white-space:nowrap}
.bl-nxb .t2{font-size:4.5px;font-weight:800;color:#fff;line-height:1.2;white-space:nowrap}
.fc{position:absolute;border-radius:14px;padding:10px 14px;box-shadow:0 12px 28px rgba(0,0,0,.1)}
.fc-l{font-size:9px;color:var(--muted);margin-bottom:3px;font-weight:500}
.fc-v{font-size:12px;font-weight:800;color:var(--brown)}
.fc1{top:0;right:0}
.fc2{bottom:0;left:0}
@media(max-width:900px){
  .hero{grid-template-columns:1fr;text-align:center;gap:40px;padding-top:90px}
  .hero-left{display:flex;flex-direction:column;align-items:center}
  .cred-grid{max-width:480px;width:100%}
  .hero-sub{text-align:center}
  .hero-btns,.hero-stats{justify-content:center}
  .book-scene{margin:0 auto}
  .fc1{top:-10px;right:-10px}
  .fc2{bottom:-10px;left:-10px}
}
@media(max-width:480px){.cred-grid{grid-template-columns:1fr}.book3d{width:180px;height:252px}}

/* PROOF BAR */
.proof-bar{background:var(--brown);padding:20px 48px}
.proof-static{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0}
.proof-item{display:flex;align-items:center;gap:8px;padding:7px 20px;border-right:.5px solid rgba(255,255,255,.1)}
.proof-item:last-child{border-right:none}
.pdot{width:5px;height:5px;background:var(--gold);border-radius:50%;flex-shrink:0}
.pname{font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.prole{font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap}
@media(max-width:700px){.proof-item{padding:6px 12px;border-right:none}.prole{display:none}}

/* VIDEO */
.video-sec{background:linear-gradient(160deg,#FFF3E6 0%,#FFE4C8 100%)}
.video-inner{max-width:860px;margin:0 auto}
.video-head{text-align:center;margin-bottom:28px}
.video-title{font-size:clamp(22px,3vw,36px);font-weight:900;color:var(--brown);letter-spacing:-1px;line-height:1.2;margin-top:8px}
.video-frame{position:relative;padding-bottom:56.25%;border-radius:20px;overflow:hidden;box-shadow:0 24px 64px rgba(232,82,10,.18)}
.video-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.video-tags{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.vtag{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:rgba(255,255,255,.6);border:1px solid rgba(232,82,10,.15);border-radius:100px;font-size:13px;color:var(--brown2);font-weight:500;backdrop-filter:blur(8px)}

/* TENSION */
.tension-sec{background:linear-gradient(135deg,#1A0800 0%,#2C1000 100%);padding:100px 48px}
.tension-label{color:var(--gold);letter-spacing:3px;font-size:11px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:16px}
.tension-title{font-size:clamp(28px,4vw,52px);font-weight:900;color:#fff;letter-spacing:-1.5px;line-height:1.1;margin-bottom:48px;max-width:700px}
.tension-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:900px){.tension-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.tension-grid{grid-template-columns:1fr}}
.tstat{padding:28px 24px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:center}
.tstat-num{font-size:clamp(36px,5vw,56px);font-weight:900;color:var(--gold);letter-spacing:-2px;line-height:1;display:block;margin-bottom:10px}
.tstat-desc{font-size:13px;color:rgba(255,255,255,.55);line-height:1.6}
.tstat-desc strong{color:rgba(255,255,255,.85);display:block;margin-bottom:4px;font-size:14px}
.tension-cta{margin-top:40px;text-align:center}
.tension-cta p{font-size:16px;color:rgba(255,255,255,.6);margin-bottom:20px;font-style:italic}

/* ERA */
.era-sec{background:#fff}
.era-compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:52px}
@media(max-width:700px){.era-compare{grid-template-columns:1fr}}
.era-card{border-radius:24px;padding:32px}
.era-old{background:#F9F5F2;border:1.5px solid rgba(0,0,0,.06)}
.era-new{background:linear-gradient(135deg,#FFF5EE,#FFE4CC);border:1.5px solid rgba(232,82,10,.18)}
.era-head{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(0,0,0,.06)}
.era-old .era-head{color:#aaa}
.era-new .era-head{color:var(--or)}
.era-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.04);font-size:14px;line-height:1.55}
.era-item:last-child{border-bottom:none}
.era-item span:first-child{flex-shrink:0;font-size:15px}
.era-item span:last-child{color:var(--brown2);font-weight:500}
.insight-bar{margin-top:32px;padding:22px 28px;background:rgba(232,82,10,.05);border-radius:14px;border:1px solid rgba(232,82,10,.1);text-align:center}
.insight-bar p{font-size:clamp(16px,2vw,20px);font-weight:700;color:var(--brown);font-style:italic;line-height:1.5}

/* PROFIT */
.profit-sec{background:linear-gradient(160deg,#FFF8F0,#FFE8D0)}
.profit-layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:52px;align-items:start}
@media(max-width:700px){.profit-layout{grid-template-columns:1fr}}
.profit-holes{display:flex;flex-direction:column;gap:10px}
.phole{border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;transition:all .3s;background:rgba(255,255,255,.7);border:1px solid rgba(232,82,10,.1)}
.phole:hover{transform:translateX(5px);border-color:rgba(232,82,10,.3)}
.phole-icon{font-size:22px;flex-shrink:0}
.phole-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.phole-val{font-size:16px;font-weight:800;color:var(--brown)}
.phole-note{font-size:12px;color:var(--muted);margin-top:1px}
.profit-insight{background:linear-gradient(135deg,var(--or),#C93D00);border-radius:24px;padding:32px;color:#fff}
.profit-big{font-size:clamp(20px,2.5vw,28px);font-weight:900;line-height:1.35;margin-bottom:16px}
.profit-body{font-size:14px;opacity:.85;line-height:1.8;margin-bottom:16px}
.profit-warn{background:rgba(255,255,255,.15);border-radius:10px;padding:14px 16px;font-size:14px;font-weight:700;line-height:1.55;border:1px solid rgba(255,255,255,.2)}

/* AI */
.ai-sec{background:#fff}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:52px}
@media(max-width:900px){.ai-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.ai-grid{grid-template-columns:1fr}}
.ai-card{border-radius:22px;padding:24px;transition:all .3s;position:relative;overflow:hidden;background:rgba(255,248,240,.8);border:1px solid rgba(232,82,10,.1)}
.ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--or),var(--gold))}
.ai-card:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(232,82,10,.1);border-color:rgba(232,82,10,.25)}
.ai-ico{font-size:28px;margin-bottom:10px;display:block}
.ai-t{font-size:14px;font-weight:800;color:var(--brown);margin-bottom:6px}
.ai-d{font-size:13px;color:var(--muted);line-height:1.65}
.ai-big{margin-top:40px;background:var(--brown);border-radius:24px;padding:40px;text-align:center;color:#fff}
.ai-big h3{font-size:clamp(20px,3vw,32px);font-weight:900;line-height:1.35;margin-bottom:12px;letter-spacing:-.5px}
.ai-big p{font-size:15px;color:rgba(255,255,255,.65);max-width:520px;margin:0 auto;line-height:1.75}

/* NO RENT */
.norent-sec{background:linear-gradient(160deg,#FFF8F0,#FFE8D0)}
.norent-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:52px}
@media(max-width:700px){.norent-grid{grid-template-columns:1fr}}
.norent-col h3{font-size:16px;font-weight:800;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(0,0,0,.06)}
.norent-col.danger h3{color:#C44}

}

const couponInput = document.getElementById('f-coupon');
if (couponInput) {
  couponInput.addEventListener('blur', normalizeCoupon);
  couponInput.addEventListener('input', () => {
    validatedCoupon = null;
    document.getElementById('couponResult').textContent = '';
    document.getElementById('couponResult').className = 'coupon-result';
    updatePriceDisplay();
  });
}

async function applyCoupon() {
  normalizeCoupon();
  const code    = document.getElementById('f-coupon').value.trim().toUpperCase();
  const product = document.getElementById('f-product').value;
  const resultEl = document.getElementById('couponResult');
  const btn = document.getElementById('btnApplyCoupon');

  if (!code) {
    resultEl.textContent = 'Vui lòng nhập mã giảm giá.';
    resultEl.className = 'coupon-result fail';
    return;
  }
  if (!product) {
    resultEl.textContent = 'Vui lòng chọn sản phẩm trước khi áp dụng mã.';
    resultEl.className = 'coupon-result fail';
    return;
  }

  btn.disabled = true;
  btn.textContent = '...';
  resultEl.textContent = '';
  resultEl.className = 'coupon-result';

  try {
    const res = await fetch(`${WORKER_URL}/validate-coupon`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product, coupon_code: code }),
    });
    const data = await res.json();

    if (data.ok) {
      validatedCoupon = { code, original_amount: data.original_amount, discount_amount: data.discount_amount, final_amount: data.final_amount };
      const saved = data.discount_amount.toLocaleString('vi-VN');
      const final = data.final_amount.toLocaleString('vi-VN');
      resultEl.textContent = `✅ Mã hợp lệ — Giảm ${saved}đ, còn ${final}đ`;
      resultEl.className = 'coupon-result ok';
      updatePriceDisplay();
    } else {
      validatedCoupon = null;
      resultEl.textContent = '❌ ' + (data.error || 'Mã không hợp lệ');
      resultEl.className = 'coupon-result fail';
      updatePriceDisplay();
    }
  } catch (err) {
    resultEl.textContent = '❌ Không kiểm tra được mã, vui lòng thử lại.';
    resultEl.className = 'coupon-result fail';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Áp dụng';
  }
}

const PRODUCT_INFO = {
  ebook: { name: 'Ebook PDF — Ecom Truyền Kỳ', price: '199.000đ', raw: 199000 },
  sach:  { name: 'Sách in — Ecom Truyền Kỳ',   price: '349.000đ', raw: 349000 },
  combo: { name: 'Combo Ebook + Sách in',        price: '420.000đ', raw: 420000 },
};

function updatePriceDisplay() {
  const val = document.getElementById('f-product').value;
  const display = document.getElementById('selectedProductDisplay');
  const origEl  = document.getElementById('selectedProductOriginalPrice');
  const priceEl = document.getElementById('selectedProductPrice');

  if (!val || !PRODUCT_INFO[val]) { display.style.display = 'none'; return; }

  document.getElementById('selectedProductName').textContent = PRODUCT_INFO[val].name;
  if (validatedCoupon && validatedCoupon.final_amount) {
    origEl.textContent   = PRODUCT_INFO[val].price;
    origEl.style.display = 'block';
    priceEl.textContent  = validatedCoupon.final_amount.toLocaleString('vi-VN') + 'đ';
  } else {
    origEl.style.display = 'none';
    priceEl.textContent  = PRODUCT_INFO[val].price;
  }
  display.style.display = 'flex';
}

// ── Fade-in scroll ───────────────────────────────────────
const obs = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));

// ── Navbar hide/show + active ────────────────────────────
let lastY = 0;
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  navbar.style.transform = (y > lastY && y > 80) ? 'translateY(-100%)' : 'translateY(0)';
  lastY = y;
  document.querySelectorAll('.nav-menu a').forEach(a => {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (!el) return;
    const r = el.getBoundingClientRect();
    a.classList.toggle('active', r.top <= 80 && r.bottom > 80);
  });
});

// ── Hamburger ────────────────────────────────────────────
function toggleMenu() { document.getElementById('mobileMenu').classList.toggle('open'); }
function closeMenu()  { document.getElementById('mobileMenu').classList.remove('open'); }

// ── Pricing cards → jump to form ────────────────────────
function selectProduct(val) {

  onProductChange();
  document.getElementById('order').scrollIntoView({ behavior: 'smooth' });

// ── Product change: show/hide address ───────────────────
function onProductChange() {
  const val = document.getElementById('f-product').value;
  const addrGroup = document.getElementById('addressGroup');
  const addrInput = document.getElementById('f-address');

  if (val === 'ebook') {
    addrGroup.style.display = 'none';
    addrInput.required = false;
  } else {
    addrGroup.style.display = 'flex';
    addrInput.required = true;
  }

  if (validatedCoupon) {
    validatedCoupon = null;
    document.getElementById('couponResult').textContent = 'Sản phẩm thay đổi — vui lòng áp dụng lại mã giảm giá.';
    document.getElementById('couponResult').className = 'coupon-result fail';
  }

  updatePriceDisplay();
}

// ── Invoice toggle ───────────────────────────────────────
function toggleInvoiceFields() {
  const checked = document.getElementById('f-invoice-requested').checked;
  const box = document.getElementById('invoiceFields');
  const companyName = document.getElementById('f-invoice-company-name');
  const taxCode = document.getElementById('f-invoice-tax-code');
  const invoiceEmail = document.getElementById('f-invoice-email');

  box.style.display = checked ? 'block' : 'none';
  companyName.required = checked;
  taxCode.required = checked;
  invoiceEmail.required = checked;

  if (!checked) {
    ['f-invoice-company-name','f-invoice-tax-code','f-invoice-email','f-invoice-company-address']
      .forEach(id => document.getElementById(id).classList.remove('err'));
  }
}

// ── Xóa viền đỏ khi khách sửa field ─────────────────────
document
  .querySelectorAll('#f-name, #f-phone, #f-email, #f-address, #f-invoice-company-name, #f-invoice-tax-code, #f-invoice-email')
  .forEach(inputField => { inputField.addEventListener('input', function () { this.classList.remove('err'); }); });

// ── Validate + gọi Worker ────────────────────────────────
async function doOrder() {
  normalizeCoupon();

  const name    = document.getElementById('f-name').value.trim();
  const phone   = document.getElementById('f-phone').value.trim();
  const email   = document.getElementById('f-email').value.trim();
  const product = document.getElementById('f-product').value;
  const address = document.getElementById('f-address').value.trim();
  const note    = document.getElementById('f-note').value.trim();

  const coupon_code          = document.getElementById('f-coupon').value.trim().toUpperCase();
  const is_invoice_requested = document.getElementById('f-invoice-requested').checked;
  const invoice_company_name    = document.getElementById('f-invoice-company-name').value.trim();
  const invoice_tax_code        = document.getElementById('f-invoice-tax-code').value.trim();
  const invoice_company_address = document.getElementById('f-invoice-company-address').value.trim();
  const invoice_email           = document.getElementById('f-invoice-email').value.trim().toLowerCase();

  const phoneClean = phone.replace(/[\s.-]/g, '');
  const phoneValid = /^(0[35789][0-9]{8}|\+?84[35789][0-9]{8})$/.test(phoneClean);

  let hasErr = false;
  const fields = [
    { id: 'f-name',    cond: name.length > 0 },
    { id: 'f-phone',   cond: phoneValid },
    { id: 'f-email',   cond: email.includes('@') && email.includes('.') },
    { id: 'f-product', cond: product !== '' },
  ];
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    if (!f.cond) { el.classList.add('err'); hasErr = true; }
    else { el.classList.remove('err'); }
  });
  if (product !== 'ebook') {
    const addrEl = document.getElementById('f-address');
    if (!address) { addrEl.classList.add('err'); hasErr = true; }
    else { addrEl.classList.remove('err'); }
  }
  if (is_invoice_requested) {
    const invoiceFields = [
      { id: 'f-invoice-company-name', cond: invoice_company_name.length > 0 },
      { id: 'f-invoice-tax-code',     cond: invoice_tax_code.length > 0 },
      { id: 'f-invoice-email',        cond: invoice_email.includes('@') },
    ];
    invoiceFields.forEach(f => {
      const el = document.getElementById(f.id);
      if (!f.cond) { el.classList.add('err'); hasErr = true; }
      else { el.classList.remove('err'); }
    });
  }

  if (hasErr) {
    const firstErrField = document.querySelector('.err');
    if (!phoneValid && phone.length > 0) {
      alert('Số điện thoại không đúng định dạng. Vui lòng nhập số điện thoại Việt Nam 10 số.');
    } else if (is_invoice_requested && invoice_email.length > 0 && !invoice_email.includes('@')) {
      alert('Vui lòng nhập đúng định dạng Email nhận hóa đơn, ví dụ: ketoan@congty.com');
    } else {
      alert('Vui lòng kiểm tra và điền đầy đủ các thông tin bắt buộc đang được đánh dấu đỏ.');
    }
    if (firstErrField) {
      firstErrField.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => firstErrField.focus(), 300);
    }
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Đang tạo đơn...';

  try {
    const res = await fetch(`${WORKER_URL}/create-order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone: phoneClean, email, product, address, note, coupon_code,
        is_invoice_requested, invoice_company_name, invoice_tax_code, invoice_company_address, invoice_email }),
    });
    const data = await res.json();
    if (!data.ok) {
      let message = data.error || 'Có lỗi xảy ra, vui lòng thử lại.';

      // Trường hợp race hợp lệ: mã vừa được báo hợp lệ lúc "Áp dụng",
      // nhưng hết lượt trước khi khách bấm "Xác nhận đặt sách".
      if (
        coupon_code &&
        /mã giảm giá|mã ưu đãi|coupon/i.test(message)
      ) {
        message = 'Mã ưu đãi vừa hết lượt hoặc không còn khả dụng. Vui lòng bỏ mã hoặc thử mã khác.';
      }

      alert('❌ ' + message);
      return;
    }
    showQRModal(data.order_id, data.amount, data.qr_url);
  } catch (err) {
    alert('❌ Không kết nối được server. Vui lòng kiểm tra mạng và thử lại.');
  } finally {
    btn.disabled = false;
    btn.textContent = '🛒 XÁC NHẬN ĐẶT SÁCH';
  }
}

// ── QR Modal ─────────────────────────────────────────────
let pollInterval = null;
let countdownInterval = null;
let currentOrderId = null;

function showQRModal(orderId, amount, qrUrl) {
  currentOrderId = orderId;
  document.getElementById('qrAmount').textContent = Number(amount).toLocaleString('vi-VN') + 'đ';
  document.getElementById('qrContent').textContent = orderId;
  document.getElementById('qrImg').src = qrUrl;
  document.getElementById('qrMain').style.display = 'block';
  document.getElementById('qrSuccess').classList.remove('show');
  document.getElementById('qrTimeout').classList.remove('show');
  document.getElementById('qrStatus').textContent = '🔄 Đang chờ thanh toán...';
  document.getElementById('qrOverlay').classList.remove('hidden');
  startCountdown(5 * 60);
  startPolling(orderId);
}

function startCountdown(seconds) {
  clearInterval(countdownInterval);
  let remaining = seconds;
  const el = document.getElementById('qrCountdown');
  countdownInterval = setInterval(() => {
    remaining--;
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    el.textContent = `${m}:${String(s).padStart(2, '0')}`;
    if (remaining <= 0) { clearInterval(countdownInterval); stopPolling(); showTimeout(); }
  }, 1000);
}

function startPolling(orderId) {
  clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    try {
      const res  = await fetch(`${WORKER_URL}/check-order?id=${orderId}`);
      const data = await res.json();
      if (data.ok && data.status === 'PAID') { stopAll(); showSuccess(); }
    } catch (_) {}
  }, 5000);
}

function stopPolling() { clearInterval(pollInterval); }
function stopAll() { clearInterval(pollInterval); clearInterval(countdownInterval); }

function showSuccess() {
  document.getElementById('qrMain').style.display = 'none';
  document.getElementById('qrSuccess').classList.add('show');
}

function showTimeout() {
  document.getElementById('qrMain').style.display = 'none';
  document.getElementById('qrTimeout').classList.add('show');
}

// ── Custom close QR confirm ──────────────────────────────
function closeQR() {
  document.getElementById('confirmOverlay').classList.remove('hidden');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.add('hidden');
}

function doCloseQR() {
  stopAll();
  document.getElementById('confirmOverlay').classList.add('hidden');
  document.getElementById('qrOverlay').classList.add('hidden');
  currentOrderId = null;
}
